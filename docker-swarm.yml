version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    user: "0:0"
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 30s
    networks:
      - broker-bot
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:latest
    user: "0:0"
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 60s
    networks:
      - broker-bot
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_MESSAGE_MAX_BYTES: 157286400
      KAFKA_REPLICA_FETCH_MAX_BYTES: 157286400
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 3

  kafka-setup:
    image: confluentinc/cp-kafka:latest
    deploy:
      restart_policy:
        condition: none
    networks:
      - broker-bot
    command: >
      sh -c "kafka-topics --create --topic telegram-messages --partitions 1 --replication-factor 1 --if-not-exists --bootstrap-server kafka:29092"

  kafdrop:
    image: obsidiandynamics/kafdrop:3.27.0
    deploy:
      restart_policy:
        condition: on-failure
    networks:
      - broker-bot
    ports:
      - 19000:9000
    environment:
      KAFKA_BROKERCONNECT: kafka:29092

  redis:
    image: redis:7-alpine
    command: redis-server --port 6380
    deploy:
      restart_policy:
        condition: on-failure
    networks:
      - broker-bot
    ports:
      - "6380:6380"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  mongo:
    image: mongo:7
    user: "0:0"
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      - "27017:27017"
    networks:
      - broker-bot
    environment:
      MONGO_INITDB_ROOT_USERNAME=/run/secrets/mg_username
      MONGO_INITDB_ROOT_PASSWORD=/run/secrets/mg_password
    secrets:
      - source: mg_username
        target: MG_USERNAME
      - source: mg_password
        target: MG_PASSWORD
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@127.0.0.1:27017", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    image: ${BOT_IMAGE}
    networks:
      - broker-bot
    command: ["/bin/sh", "-c", "./.deploy/bot.sh"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      restart_policy:
        condition: on-failure

  main:
    image: ${MAIN_IMAGE}
    networks:
      - broker-bot
    command: ["/bin/sh", "-c", "./.deploy/main.sh"]
    deploy:
      restart_policy:
        condition: on-failure

  celery:
    image: ${CELERY_IMAGE}
    networks:
      - broker-bot
    command: ["/bin/sh", "-c", "./.deploy/celery.sh"]
    deploy:
      restart_policy:
        condition: on-failure

networks:
  broker-bot:
    driver: overlay

volumes:
  mongo-data:

secrets:
  mg_username:
    external: true
  mg_password:
    external: true
